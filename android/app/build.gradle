plugins {
    id "com.android.application"
}

android {
    namespace "cn.baboudou.xundian.nativeapp"
    compileSdk 35

    defaultConfig {
        applicationId "cn.baboudou.xundian.nativeapp"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "1.0.16"
    }

    signingConfigs {
        release {
            if (System.getenv("XUNDIAN_KEYSTORE_PATH")) {
                storeFile file(System.getenv("XUNDIAN_KEYSTORE_PATH"))
                storePassword System.getenv("XUNDIAN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("XUNDIAN_KEY_ALIAS")
                keyPassword System.getenv("XUNDIAN_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.work:work-runtime:2.9.1"
}
